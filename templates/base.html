<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}通讯录{% endblock %} · 青简</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"><script defer src="{{ url_for('static', filename='js/main.js') }}"></script></head>
<body><aside class="sidebar"><a class="brand" href="{{ url_for('contacts.index') }}"><span class="brand-icon">青</span>青简<span class="brand-sub">通讯录</span></a><p class="nav-label">我的空间</p><nav><a class="nav-item {% if request.endpoint == 'contacts.index' and not request.args.get('favorites') %}active{% endif %}" href="{{ url_for('contacts.index') }}">▦ <span>全部联系人</span></a><a class="nav-item {% if request.args.get('favorites') %}active{% endif %}" href="{{ url_for('contacts.index', favorites=1) }}">☆ <span>收藏联系人</span></a><a class="nav-item {% if request.endpoint == 'contacts.import_excel' %}active{% endif %}" href="{{ url_for('contacts.import_excel') }}">⇅ <span>导入联系人</span></a></nav><div class="sidebar-note"><span class="dot"></span> 本地存储，安心连接<p>让每一份联系，都井然有序。</p></div></aside>
<div class="workspace"><header class="topbar"><span>个人通讯录 <span class="muted">/ 连接重要的人</span></span><span class="badge">EE308 · v1.0</span></header><main>{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="alert {{ category }}" role="status">{{ message }}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main><footer>青简通讯录 <span>简单记录 · 长久联系</span></footer></div></body></html>
